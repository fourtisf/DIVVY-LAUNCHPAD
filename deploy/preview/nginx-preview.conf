# Password-protected preview of uspad.fun (demo data). Install: deploy/preview/README.md.
# certbot --nginx adds HTTPS and the http -> https redirect to this file.
# The password sits on the locations, not the server, so certbot's ACME challenge isn't asked for it.

map $http_upgrade $uspad_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name uspad.fun;
    server_tokens off;
    client_max_body_size 9m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $uspad_upgrade;

    # Let's Encrypt checks the domain here: no password. certbot --nginx also adds its own exact
    # location for each check, which wins over this one.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # The site (Next.js on :3000).
    location / {
        auth_basic "uspad preview";
        auth_basic_user_file /etc/nginx/uspad-preview.htpasswd;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3000;
    }

    # The API (demo mode on :4000), including the live-events socket at /api/live.
    location ^~ /api/ {
        auth_basic "uspad preview";
        auth_basic_user_file /etc/nginx/uspad-preview.htpasswd;
        proxy_read_timeout 1h;
        proxy_pass http://127.0.0.1:4000;
    }

    # Any other spelling of /api would reach Next instead of the API.
    location ~* ^/api(/|$) {
        return 404;
    }
}
