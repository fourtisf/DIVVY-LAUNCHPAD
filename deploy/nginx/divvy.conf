# Divvy: Nginx site for the Hostinger VPS (Ubuntu 24.04, nginx 1.24).
#
# Install (deploy/setup-vps.md §7): copy, don't symlink, so a deploy never changes the live proxy unreviewed.
#   sudo cp deploy/nginx/divvy.conf /etc/nginx/sites-available/divvy.conf
#   sudo ln -s /etc/nginx/sites-available/divvy.conf /etc/nginx/sites-enabled/divvy.conf
#   sudo rm -f /etc/nginx/sites-enabled/default        # this file brings its own default_server
#   sudo nginx -t && sudo systemctl reload nginx
#
# Placeholders to replace before use:
#   divvy.example         the real domain (server_name, certificate paths, CSP connect-src, redirects)
#   rpc.divvy.example     origin of NEXT_PUBLIC_SOLANA_RPC_URL (the RPC the browser talks to), in the CSP
#
# This file is included inside `http { }` by /etc/nginx/nginx.conf, so the zones, maps and upstreams
# below are http-level. Every name is prefixed with divvy_ so it can't collide with another site.
# If the VPS has IPv6 turned off, `nginx -t` fails with "Address family not supported": delete the
# `listen [::]:...` lines.

# ---------------------------------------------------------------------------------------------------
# Rate limits. Coarse, per client IP. The API is the authority on limits (3 launches per wallet per day,
# 120 s cooldown, HANDOFF §6); these zones only shed floods before they reach Node.
# Behind Cloudflare, $binary_remote_addr is a Cloudflare edge unless the real_ip block below is enabled.
limit_req_zone  $binary_remote_addr zone=divvy_web:10m    rate=20r/s;
limit_req_zone  $binary_remote_addr zone=divvy_api:10m    rate=20r/s;
limit_req_zone  $binary_remote_addr zone=divvy_upload:10m rate=10r/m;
# A paid launch takes a few requests (asking for the fee, then the launch with the payment); the API
# keeps its own limit (60 an hour).
limit_req_zone  $binary_remote_addr zone=divvy_launch:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=divvy_ws:10m;

# ---------------------------------------------------------------------------------------------------
# Visitor country, sent to the web app and the API as X-Geo-Country (ISO 3166-1 alpha-2) for the
# geofence (HANDOFF §10). Exactly one option must be active. Nginx always overwrites the header, so a
# client-supplied X-Geo-Country never reaches the apps; when the country is unknown the header is omitted.
#
# Option A (active): GeoIP2 lookup on this server. Needs libnginx-mod-http-geoip2 and a country database
# kept fresh by geoipupdate (deploy/setup-vps.md §7). Nginx refuses to start if the file is missing.
geoip2 /var/lib/GeoIP/GeoLite2-Country.mmdb {
    $geoip2_data_country_iso_code country iso_code;
}
map $geoip2_data_country_iso_code $divvy_geo_country {
    default $geoip2_data_country_iso_code;
}
#
# Option B: Cloudflare in front of the origin (proxied DNS record, "IP Geolocation" on). Comment out
# Option A and uncomment this map. CF-IPCountry is just a request header, so it can be forged by anyone
# who reaches the origin directly: only use this when ports 80/443 accept Cloudflare's ranges alone
# (ufw rules or Authenticated Origin Pulls), and enable the real_ip block in the HTTPS server.
# Cloudflare sends XX for unknown and T1 for Tor; the app should treat both as "not allowed".
# map $http_cf_ipcountry $divvy_geo_country {
#     default $http_cf_ipcountry;
# }

# ---------------------------------------------------------------------------------------------------
# WebSocket upgrade for /api/live. Plain requests get an empty Connection header, which keeps the
# upstream keepalive pool usable.
map $http_upgrade $divvy_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream divvy_web {
    server 127.0.0.1:3000;     # PM2 divvy-web (cluster), next start -H 127.0.0.1
    keepalive 16;
}

upstream divvy_api {
    server 127.0.0.1:4000;     # PM2 divvy-api (cluster), API_HOST=127.0.0.1
    keepalive 16;
}

# ---------------------------------------------------------------------------------------------------
# Catch-all: requests for any other Host (bare IP, scanners) get nothing. ssl_reject_handshake needs
# no certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    return 444;
}

# HTTP: ACME challenges for certbot (webroot), everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name divvy.example www.divvy.example;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://divvy.example$request_uri;
    }
}

# HTTPS. To serve www.divvy.example as well, add it to the certificate (-d www.divvy.example) and add a
# server block for it that returns 301 to https://divvy.example$request_uri.
server {
    # On nginx >= 1.25.1 write `listen 443 ssl;` plus `http2 on;` instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name divvy.example;
    server_tokens off;

    # certbot certonly --webroot -w /var/www/certbot -d divvy.example (deploy/setup-vps.md §7).
    ssl_certificate     /etc/letsencrypt/live/divvy.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/divvy.example/privkey.pem;
    # Mozilla "intermediate". No OCSP stapling: Let's Encrypt stopped running OCSP in 2025.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:divvy_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/divvy.access.log;
    error_log  /var/log/nginx/divvy.error.log warn;

    # Option B only (Cloudflare): trust CF-Connecting-IP from Cloudflare's ranges, so $remote_addr, the
    # rate-limit zones and the API's request IP are the visitor, not the edge. Add one set_real_ip_from
    # line per range listed at https://www.cloudflare.com/ips/ (IPv4 and IPv6) and re-check that list
    # from time to time.
    # set_real_ip_from <cloudflare-range>;
    # real_ip_header CF-Connecting-IP;

    # Uploads are capped at 8 MB (HANDOFF §5); /api/upload raises this below. JSON bodies are tiny
    # (Fastify bodyLimit is 64 KB), so everything else stays at 1 MB.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml;

    # ---- security headers -------------------------------------------------------------------------
    # Every add_header lives at this level. A location with its own add_header would silently drop all
    # of these, so don't add one there.
    #
    # Content-Security-Policy (HANDOFF §9: only the font, CDN and RPC origins in use):
    #  - script-src keeps 'unsafe-inline' because Next.js 14 App Router injects inline bootstrap scripts
    #    (self.__next_f.push). To drop it, generate a per-request nonce in Next middleware, pass it to
    #    the layout, and send this header from Next instead of from here. The layout is already
    #    force-dynamic, which nonces require.
    #  - style-src/font-src: Fontshare and Google Fonts (apps/web/src/app/layout.tsx; the wallet adapter's
    #    stylesheet also imports a Google font).
    #  - img-src: the app serves pictures from /api/media (same origin). With STORAGE_DRIVER=s3 the
    #    pictures load from PUBLIC_MEDIA_BASE instead: add that origin (e.g. https://media.divvy.example)
    #    here, or every coin picture is blocked. The 3D coins load the same pictures as textures with
    #    crossOrigin="anonymous", so a bucket also needs a CORS rule allowing GET from divvy.example.
    #  - connect-src: same-origin API, the live socket, and the browser's Solana RPC. web3.js opens a
    #    WebSocket to the same host for confirmations, so list both https:// and wss://. Origins only:
    #    never put an RPC API key in this file. If NEXT_PUBLIC_SOLANA_RPC_URL is left empty, the app
    #    falls back to the public mainnet RPC, which would need https://api.mainnet-beta.solana.com
    #    and wss://api.mainnet-beta.solana.com here.
    #  - connect-src also allows ws://localhost:*: on Android, the Mobile Wallet Adapter reaches the
    #    wallet app through a local WebSocket. That is also why there is no upgrade-insecure-requests
    #    (it would rewrite that socket to wss:// and break it); HSTS already keeps the site on HTTPS.
    #  - frame-src: the Solflare adapter opens connect.solflare.com in an iframe when the extension
    #    isn't installed.
    set $divvy_csp "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'";
    set $divvy_csp "${divvy_csp}; script-src 'self' 'unsafe-inline'";
    set $divvy_csp "${divvy_csp}; style-src 'self' 'unsafe-inline' https://api.fontshare.com https://fonts.googleapis.com";
    set $divvy_csp "${divvy_csp}; font-src 'self' https://cdn.fontshare.com https://fonts.gstatic.com";
    set $divvy_csp "${divvy_csp}; img-src 'self' data: blob:";
    set $divvy_csp "${divvy_csp}; connect-src 'self' wss://divvy.example https://rpc.divvy.example wss://rpc.divvy.example ws://localhost:*";
    set $divvy_csp "${divvy_csp}; frame-src https://connect.solflare.com";
    set $divvy_csp "${divvy_csp}; worker-src 'self' blob:; manifest-src 'self'";
    add_header Content-Security-Policy $divvy_csp always;

    # Add `; preload` only once every subdomain is HTTPS for good: preload lists are slow to leave.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    # ---- headers to the apps ----------------------------------------------------------------------
    # Set once here and inherited by every location (a location that sets any proxy_set_header loses
    # all of these, so none does).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $divvy_connection_upgrade;
    # One address, not a chain: Fastify runs with trustProxy: true and takes the left-most
    # X-Forwarded-For entry as the client IP, so appending to a client-sent header would let anyone
    # pick their own IP for the API's rate limits.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Geo-Country     $divvy_geo_country;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    limit_req_status  429;
    limit_conn_status 429;

    # Errors Nginx generates itself use the API's error shape {code, message, collidesWith}
    # (HANDOFF §5), so the UI can show the message as it does for API errors.
    location @divvy_rate_limited {
        default_type application/json;
        return 429 '{"code":"RATE_LIMITED","message":"Too many requests. Wait a minute and try again.","collidesWith":null}';
    }
    location @divvy_upload_too_large {
        default_type application/json;
        return 413 '{"code":"IMAGE_SIZE","message":"That file is over 8 MB","collidesWith":null}';
    }

    # ---- Next 14 surface Divvy doesn't use --------------------------------------------------------
    # Next 14 no longer gets security fixes (docs/AUDIT.md, dependencies). Until the owner approves the
    # move to 15.5, shut the parts with open advisories that Divvy never uses: the image optimizer
    # (next.config.mjs also turns it off) and Server Actions (the app has none; a request carrying a
    # Next-Action header is never legitimate here).
    if ($http_next_action) {
        return 404;
    }
    location ^~ /_next/image {
        return 404;
    }

    # ---- web (Next.js) ----------------------------------------------------------------------------
    # Pages render on the server and call the API from there (with the visitor's IP), so they are
    # throttled too (audit). The burst covers Next prefetching every coin link on a full board at once.
    # Build assets are content-hashed and fetched many at a time: not limited.
    location / {
        limit_req zone=divvy_web burst=120 nodelay;
        error_page 429 = @divvy_rate_limited;
        # The App Router streams HTML; buffering here would hold the first bytes back.
        proxy_buffering off;
        proxy_pass http://divvy_web;
    }

    location ^~ /_next/static/ {
        access_log off;
        proxy_pass http://divvy_web;
    }

    # ---- API --------------------------------------------------------------------------------------
    # ^~ so no regex location below can take an /api/ request. Any other spelling (/API/, /Api/, a
    # bare /api) would otherwise fall through to Next, outside the API's limits: answer it with 404.
    location ~* ^/api(/|$) {
        default_type application/json;
        return 404 '{"code":"NOT_FOUND","message":"Not found","collidesWith":null}';
    }

    location ^~ /api/ {
        limit_req zone=divvy_api burst=60 nodelay;
        error_page 429 = @divvy_rate_limited;
        proxy_pass http://divvy_api;
    }

    location = /api/health {
        access_log off;
        proxy_pass http://divvy_api;
    }

    # Live events (launch, trade, graduate, payout_round, meter_status). The API pings every 25 s, so
    # the long timeouts only matter if pings stop.
    location = /api/live {
        limit_req zone=divvy_api burst=20 nodelay;
        limit_conn divvy_ws 10;
        error_page 429 = @divvy_rate_limited;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_pass http://divvy_api;
    }

    location = /api/upload {
        limit_req zone=divvy_upload burst=5 nodelay;
        error_page 429 = @divvy_rate_limited;
        client_max_body_size 9m;
        error_page 413 = @divvy_upload_too_large;
        proxy_pass http://divvy_api;
    }

    # POST /api/launch only. GET /api/launch/:id (polled by the 4-step modal) stays under /api/.
    location = /api/launch {
        # Emergency launch stop that works without a deploy (docs/RUNBOOK.md "Pausing launches"):
        #   sudo touch /etc/nginx/divvy-launches-paused     # pause
        #   sudo rm /etc/nginx/divvy-launches-paused        # resume
        # Checked on every request, no reload needed. The create page still shows its normal button;
        # the launch then fails with this message. The admin pause (/admin, launchesOpen) is the
        # normal switch and also tells the create page; this one is for when the API itself is down.
        if (-f /etc/nginx/divvy-launches-paused) {
            return 503 '{"code":"LAUNCHES_PAUSED","message":"Launches are paused.","collidesWith":null}';
        }
        default_type application/json;
        limit_req zone=divvy_launch burst=10 nodelay;
        error_page 429 = @divvy_rate_limited;
        proxy_pass http://divvy_api;
    }
}
