# Local Postgres + Redis for development. Not used in production (Hostinger VPS runs them natively).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: divvy
      POSTGRES_PASSWORD: divvy
      POSTGRES_DB: divvy
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
