# Local Postgres + Redis for development. Not used in production (Hostinger VPS runs them natively).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: divvy
      POSTGRES_PASSWORD: divvy
      POSTGRES_DB: divvy
    ports: ["127.0.0.1:5432:5432"]  # loopback only: the dev password is public
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]  # loopback only: Redis has no password here
volumes:
  pgdata:
