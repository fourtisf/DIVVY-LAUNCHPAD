<title>hwai 中文版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Ported verbatim from prototype/divvy-prototype.html <style>. Keep in sync; don't restyle (CLAUDE.md rule 1). */
:root{
  --bg:#0A0F0D; --s1:#0F1714; --s2:#131E1A; --s3:#192620; --s4:#20302A;
  --hair:rgba(134,239,172,.08); --hair2:rgba(134,239,172,.15); --hair3:rgba(134,239,172,.28);
  --text:#EAFBF1; --muted:#97ACA2; --faint:#64786E;
  --g:#4ADE80; --g-hi:#86EFAC; --g-deep:#16A34A; --g-ink:#03140A; --g-soft:rgba(74,222,128,.12);
  --teal:#5EEAD4; --lime:#D9F99D;
  --red:#FF6B81; --red-soft:rgba(255,107,129,.12);
  --foil:linear-gradient(115deg,#C9FFE0 0%,#86EFAC 26%,#E4FFA6 52%,#7EF2D8 76%,#C9FFE0 100%);
  --display:"Clash Display","Plus Jakarta Sans",system-ui,sans-serif;
  --ui:"Satoshi","Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --lift:inset 0 1px 0 rgba(255,255,255,.04),0 30px 60px -36px rgba(0,0,0,.8);
  --r-xl:24px; --r-lg:18px; --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;font-feature-settings:"tnum" 1}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:720px;pointer-events:none;z-index:-1;background:radial-gradient(55% 70% at 72% -12%,rgba(74,222,128,.17),rgba(74,222,128,0) 70%),radial-gradient(40% 50% at 8% 0%,rgba(94,234,212,.08),rgba(94,234,212,0) 70%)}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--g);outline-offset:2px;border-radius:8px}
img{display:block}
.wrap{max-width:1260px;margin:0 auto;padding:0 24px}
.d{font-family:var(--display);font-weight:600;letter-spacing:-.025em}
.up{color:var(--g)} .down{color:var(--red)} .muted{color:var(--muted)} .faint{color:var(--faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* header */
header.top{position:sticky;top:0;z-index:50;background:rgba(10,15,13,.78);backdrop-filter:saturate(1.5) blur(16px);-webkit-backdrop-filter:saturate(1.5) blur(16px);border-bottom:1px solid var(--hair)}
.top .wrap{display:flex;align-items:center;gap:22px;height:70px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:25px;letter-spacing:-.03em;line-height:1}
.logo-mark{width:32px;height:32px;border-radius:50%;background:var(--foil);position:relative;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45),inset 0 -4px 8px rgba(3,20,10,.35),0 6px 16px -6px rgba(74,222,128,.7)}
.logo-mark::after{content:"";position:absolute;inset:7px;border-radius:50%;border:2px dashed rgba(3,20,10,.5)}
nav.links{display:flex;gap:2px}
nav.links a{padding:8px 13px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14.5px;transition:color .15s,background .15s}
nav.links a:hover{color:var(--text)}
nav.links a[aria-current="page"]{color:var(--g-hi);background:var(--g-soft)}
.search{flex:1;max-width:400px;position:relative;margin-left:auto}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--hair);background:rgba(255,255,255,.025);padding:0 44px 0 40px;outline:none;transition:border-color .15s,background .15s}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--hair3);background:rgba(255,255,255,.045)}
.search .ico{position:absolute;left:14px;top:13px;color:var(--faint)}
.search kbd{position:absolute;right:10px;top:10px;font-family:var(--ui);font-size:12px;color:var(--faint);border:1px solid var(--hair2);border-radius:6px;padding:1px 7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:14.5px;white-space:nowrap;transition:background .15s,border-color .15s,transform .12s,box-shadow .2s,filter .15s}
.btn:active{transform:translateY(1px)}
.btn-g{background:var(--g);color:var(--g-ink);box-shadow:0 10px 28px -12px rgba(74,222,128,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-g:hover{background:var(--g-hi);box-shadow:0 14px 34px -12px rgba(74,222,128,.95),inset 0 1px 0 rgba(255,255,255,.4)}
.btn-ghost{background:rgba(255,255,255,.03);border-color:var(--hair2)}
.btn-ghost:hover{background:rgba(255,255,255,.06);border-color:var(--hair3)}
.btn-red{background:var(--red);color:#3B0814}
.btn-red:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}
.btn-lg{height:54px;padding:0 26px;font-size:16px;border-radius:14px}
.wallet-av{width:22px;height:22px;border-radius:50%;background:var(--foil)}
.lbl-short{display:none}

/* strip */
.strip{border-bottom:1px solid var(--hair);overflow:hidden;height:42px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.strip-track{display:flex;gap:36px;align-items:center;height:42px;white-space:nowrap;width:max-content;animation:marquee 80s linear infinite}
.strip:hover .strip-track{animation-play-state:paused}
@keyframes marquee{to{transform:translateX(-50%)}}
.ev{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
.ev b{color:var(--text);font-weight:700}
.ev img{width:20px;height:20px;border-radius:6px}
.ev .amt{color:var(--g);font-weight:700}

/* chips */
.chip-stock{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:-.02em;flex:none;line-height:1;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28),inset 0 -3px 6px rgba(0,0,0,.18)}
.chip-stock.m3{font-size:9px}
.tag{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--hair2);background:rgba(255,255,255,.02);font-size:13px;color:var(--muted);white-space:nowrap;transition:color .15s,border-color .15s}
.tag svg{color:var(--g)}
a.tag:hover{color:var(--text);border-color:var(--hair3)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;padding:40px 0 34px;align-items:center}
.eyecatch{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 6px;border-radius:999px;background:var(--g-soft);border:1px solid var(--hair2);color:var(--g-hi);font-size:13.5px;font-weight:500;margin-bottom:22px}
.eyecatch .dot{width:20px;height:20px;border-radius:50%;background:var(--g);display:grid;place-items:center;color:var(--g-ink)}
.hero h1{font-family:var(--display);font-weight:600;font-size:clamp(44px,5.4vw,78px);line-height:.98;letter-spacing:-.04em;margin:0 0 22px}
.hero h1 .glow{background:linear-gradient(100deg,#B6FFD2 0%,#4ADE80 45%,#D9F99D 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lede{font-size:18px;color:var(--muted);max-width:44ch;margin:0 0 30px;line-height:1.55}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.promises{display:flex;flex-wrap:wrap;gap:8px}

.stage{position:relative;height:540px;border-radius:32px}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;z-index:1;cursor:grab}
.stage .glass{z-index:3}
.stage .halo{position:absolute;left:50%;top:44%;width:380px;height:380px;margin:-190px 0 0 -190px;border-radius:50%;background:radial-gradient(circle,rgba(74,222,128,.28),rgba(74,222,128,0) 68%);filter:blur(10px);pointer-events:none}
.stage .floor{position:absolute;left:50%;bottom:58px;width:360px;height:60px;margin-left:-180px;border-radius:50%;background:radial-gradient(ellipse,rgba(74,222,128,.22),rgba(74,222,128,0) 70%);pointer-events:none}
.fallback-coin{position:absolute;left:50%;top:44%;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;background:var(--foil);box-shadow:inset 0 0 0 10px rgba(255,255,255,.35),inset 0 -20px 40px rgba(3,20,10,.35),0 40px 80px -30px rgba(74,222,128,.7);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
.glass{position:absolute;background:rgba(15,23,20,.62);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--hair2);border-radius:20px;box-shadow:0 24px 48px -24px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.06)}
.round-card{left:0;bottom:6px;width:300px;padding:16px 18px}
.round-card .k{font-size:12.5px;color:var(--faint)}
.round-card .v{font-family:var(--display);font-weight:600;font-size:34px;letter-spacing:-.03em;line-height:1.05;margin:2px 0}
.round-card .rows{margin-top:10px;border-top:1px dashed var(--hair2)}
.round-card .row{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:7px 0 0;font-size:13px}
.round-card .row img{width:22px;height:22px;border-radius:6px}
.round-card .row b{color:var(--g);font-weight:700;white-space:nowrap}
.next-card{right:6px;top:24px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.next-card .k{font-size:12px;color:var(--faint);line-height:1.1}
.next-card b{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.1}
.ring svg{transform:rotate(-90deg);display:block}

.stats-band{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--hair);border-radius:var(--r-lg);background:rgba(255,255,255,.015);margin-bottom:60px}
.stats-band > div{padding:18px 22px;border-left:1px solid var(--hair)}
.stats-band > div:first-child{border-left:0}
.stats-band b{display:block;font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:-.03em;line-height:1.1}
.stats-band span{font-size:13px;color:var(--faint)}

.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 18px}
.sec-h h2{font-family:var(--display);font-weight:600;font-size:34px;letter-spacing:-.035em;line-height:1;margin:0}
.sec-h p{margin:8px 0 0;color:var(--muted);font-size:14.5px}

/* 3D tilt */
.tilt{transform-style:preserve-3d;will-change:transform;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .2s,background .2s,box-shadow .2s}
.tilt.on{transition:transform .08s linear,border-color .2s,background .2s,box-shadow .2s}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(134,239,172,.13),rgba(134,239,172,0) 45%)}
.tilt.on::after{opacity:1}

/* leaders */
.leaders{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:60px}
.leader{position:relative;background:linear-gradient(180deg,rgba(74,222,128,.06),rgba(74,222,128,0) 55%),var(--s1);border:1px solid var(--hair2);border-radius:var(--r-xl);padding:20px;box-shadow:var(--lift);display:flex;flex-direction:column;gap:16px}
.leader:hover{border-color:var(--hair3)}
.leader .rank{position:absolute;top:16px;right:18px;font-family:var(--display);font-weight:600;font-size:15px;color:var(--g-ink);background:var(--foil);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.leader-top{display:flex;gap:14px;align-items:center;transition:transform .35s}
.leader-top img{width:64px;height:64px;border-radius:18px;box-shadow:0 14px 28px -14px rgba(0,0,0,.9)}
.leader-name{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.025em;line-height:1.1}
.leader-tick{font-size:13px;color:var(--muted)}
.leader-paid{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;transition:transform .35s}
.leader-paid b{font-family:var(--display);font-weight:600;font-size:38px;letter-spacing:-.035em;line-height:1;color:var(--g)}
.leader-paid span{font-size:13px;color:var(--faint);text-align:right}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:0 0 20px}
.seg{display:flex;background:rgba(255,255,255,.025);border:1px solid var(--hair);border-radius:13px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);height:34px;padding:0 15px;border-radius:9px;font-weight:500;font-size:14px;transition:color .15s,background .15s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{color:var(--g-ink);background:var(--g);font-weight:700}
.pays-filter{display:flex;gap:6px;align-items:center;max-width:100%;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px}
.pays-filter::-webkit-scrollbar{display:none}
.toolbar .pays-filter{flex-basis:100%}
.pays-filter > span{color:var(--faint);font-size:13px;margin-right:6px;white-space:nowrap;flex:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 5px;border-radius:999px;border:1px solid var(--hair);background:transparent;color:var(--muted);font-size:13px;transition:border-color .15s,color .15s,background .15s}
.fchip:hover{color:var(--text);border-color:var(--hair2)}
.fchip .chip-stock{width:24px;height:24px;font-size:10px}
.fchip .chip-stock.m3{font-size:8px}
.fchip.all{padding:0 14px}
.fchip[aria-pressed="true"]{border-color:var(--g);color:var(--g-hi);background:var(--g-soft)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:16px;margin-bottom:80px}
.card{position:relative;background:var(--s1);border:1px solid var(--hair);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--lift)}
a.card:hover{border-color:var(--hair3);background:var(--s2)}
.card-top{display:grid;grid-template-columns:60px minmax(0,1fr);gap:13px;align-items:center;transition:transform .35s}
.card-top img{width:60px;height:60px;border-radius:16px;box-shadow:0 10px 20px -12px rgba(0,0,0,.9)}
.card-name{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.02em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-sub{font-size:12.5px;color:var(--faint);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.card-sub .tk{color:var(--muted);font-weight:500}
.card-mid{display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px;transition:transform .35s}
.tilt.on .card-top,.tilt.on .leader-top{transform:translateZ(26px)}
.tilt.on .card-mid,.tilt.on .leader-paid{transform:translateZ(14px)}
.mcap-l{font-size:12px;color:var(--faint);margin-bottom:3px}
.mcap{font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:-.035em;line-height:1;color:var(--g)}
.mid-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.spark{width:84px;height:30px;display:block}
.chg{font-size:12.5px;font-weight:700;padding:2px 7px;border-radius:7px}
.chg.up{background:var(--g-soft)}.chg.down{background:var(--red-soft)}
.badge{font-weight:700;font-size:10.5px;border-radius:6px;padding:2px 6px;line-height:1.3}
.badge-new{background:var(--g);color:var(--g-ink)}
.badge-grad{background:rgba(94,234,212,.14);color:var(--teal)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g-deep),var(--g),var(--g-hi));box-shadow:0 0 12px rgba(74,222,128,.6)}
.bar-row{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-bottom:7px}

/* coupon */
.coupon{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:stretch;border-radius:12px;background:var(--s3);min-height:54px}
.coupon::before,.coupon::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--s1);top:50%;margin-top:-7px;z-index:2;transition:background .2s}
.coupon::before{left:-7px}.coupon::after{right:-7px}
a.card:hover .coupon::before,a.card:hover .coupon::after{background:var(--s2)}
.coupon .stub{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 16px;background:var(--foil);color:var(--g-ink);border-radius:12px 0 0 12px;position:relative;white-space:nowrap}
.coupon .stub::after{content:"";position:absolute;right:-1px;top:6px;bottom:6px;border-right:2px dotted rgba(3,20,10,.35)}
.coupon .stub small{display:block;font-size:11px;opacity:.72;line-height:1.1;font-weight:500}
.coupon .stub strong{display:block;font-size:14px;line-height:1.2;font-weight:700}
.coupon .vals{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 16px 8px 12px;align-items:center}
.coupon .vals div{font-size:11.5px;color:var(--faint);line-height:1.2;text-align:right;white-space:nowrap}
.coupon .vals b{display:block;font-size:14px;color:var(--text);font-weight:700}
.coupon .vals b.cash{color:var(--g)}
.empty{grid-column:1/-1;text-align:center;padding:64px 20px;color:var(--muted);border:1px dashed var(--hair2);border-radius:var(--r-lg)}
.link{color:var(--g)} .link:hover{text-decoration:underline}

/* coin page */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);margin:26px 0 14px;font-weight:500;font-size:14px}
.back:hover{color:var(--text)}
.coin-head{display:flex;gap:18px;align-items:center;margin-bottom:22px}
.coin3d{position:relative;width:150px;height:150px;flex:none;margin:-10px 0 -10px -12px}
.coin3d canvas{width:100%!important;height:100%!important;display:block}
.coin3d img{width:110px;height:110px;border-radius:50%;margin:20px;box-shadow:0 0 0 6px var(--g),0 20px 40px -18px rgba(74,222,128,.8)}
.coin-head h1{font-family:var(--display);font-weight:600;font-size:46px;letter-spacing:-.04em;line-height:1;margin:0}
.coin-head h1 .t{font-family:var(--ui);font-size:17px;color:var(--muted);font-weight:500;letter-spacing:0;margin-left:10px;vertical-align:middle}
.coin-head .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:13.5px}
.ca{display:inline-flex;gap:6px;align-items:center;height:30px;padding:0 11px;border-radius:999px;background:rgba(255,255,255,.02);border:1px solid var(--hair2);font-size:13px;color:var(--muted);transition:color .15s,border-color .15s}
.ca:hover{color:var(--text);border-color:var(--hair3)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--hair);border-radius:var(--r-lg);background:rgba(255,255,255,.015);margin-bottom:18px}
.kpis > div{padding:14px 18px;border-left:1px solid var(--hair);min-width:0}
.kpis > div:first-child{border-left:0}
.kpis span{display:block;font-size:12.5px;color:var(--faint);margin-bottom:2px}
.kpis b{font-family:var(--display);font-weight:600;font-size:25px;letter-spacing:-.03em;line-height:1.15;white-space:nowrap}
.coin-grid{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:18px;margin-bottom:80px}
.panel{position:relative;background:var(--s1);border:1px solid var(--hair);border-radius:var(--r-xl);padding:20px;box-shadow:var(--lift)}
.panel h3{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.025em;margin:0 0 14px;line-height:1.15}
.stack > * + *{margin-top:16px}
.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.tf{display:flex;gap:2px;background:rgba(255,255,255,.025);border:1px solid var(--hair);border-radius:11px;padding:3px}
.tf button{border:0;background:transparent;color:var(--muted);height:28px;padding:0 11px;border-radius:8px;font-size:13px;font-weight:500}
.tf button[aria-pressed="true"]{background:var(--g);color:var(--g-ink);font-weight:700}
.chart-box{position:relative;height:320px}
.chart-box canvas{width:100%;height:100%;display:block;cursor:crosshair}
.chart-tip{position:absolute;pointer-events:none;background:rgba(25,38,32,.96);border:1px solid var(--hair3);border-radius:10px;padding:7px 10px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,calc(-100% - 14px));display:none;box-shadow:0 12px 24px -12px rgba(0,0,0,.8)}
.chart-tip b{font-family:var(--display);font-weight:600;font-size:17px;display:block;line-height:1.15}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--faint);margin-top:10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--hair);margin:-6px -20px 0;padding:0 20px}
.tabs button{border:0;background:transparent;color:var(--muted);height:48px;padding:0 6px;margin-right:12px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--g)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:500;color:var(--faint);font-size:12.5px;padding:14px 10px 10px}
table.t td{padding:11px 10px;border-top:1px solid var(--hair)}
table.t tbody tr{transition:background .12s}
table.t tbody tr:hover{background:rgba(74,222,128,.03)}
table.t .r{text-align:right}
.tx{color:var(--teal)}
.side-buy{color:var(--g);font-weight:700}.side-sell{color:var(--red);font-weight:700}
.table-scroll{overflow-x:auto}

/* trade */
.toggle{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.025);border:1px solid var(--hair);border-radius:13px;padding:4px;margin-bottom:16px}
.toggle button{height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:700}
.toggle button[aria-pressed="true"].b{background:var(--g);color:var(--g-ink)}
.toggle button[aria-pressed="true"].s{background:var(--red);color:#3B0814}
.field{display:block;margin-bottom:14px}
.field > span{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:7px}
.input{display:flex;align-items:center;background:rgba(0,0,0,.22);border:1px solid var(--hair2);border-radius:14px;height:62px;padding:0 14px 0 16px;gap:10px;transition:border-color .15s,box-shadow .15s}
.input:focus-within{border-color:var(--g);box-shadow:0 0 0 4px rgba(74,222,128,.12)}
.input input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:-.03em}
.input .unit{display:flex;align-items:center;gap:7px;color:var(--text);font-weight:700;font-size:14px;background:rgba(255,255,255,.05);border-radius:999px;padding:4px 11px 4px 4px;white-space:nowrap}
.quick{display:flex;gap:6px;margin-top:8px}
.quick button{flex:1;height:32px;border-radius:9px;border:1px solid var(--hair);background:transparent;color:var(--muted);font-size:13px;font-weight:500;transition:color .15s,border-color .15s}
.quick button:hover{color:var(--g-hi);border-color:var(--hair3)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;color:var(--muted)}
.kv b{color:var(--text);font-weight:500;text-align:right}
.note{font-size:12.5px;color:var(--faint);margin:12px 0 0;line-height:1.5}

/* dividend foil */
.foil-card{border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--hair2);background:var(--s1);box-shadow:var(--lift),0 30px 60px -40px rgba(74,222,128,.5)}
.foil-top{position:relative;background:var(--foil);color:var(--g-ink);padding:18px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.foil-top::before,.foil-top::after{content:"";position:absolute;bottom:-9px;width:18px;height:18px;border-radius:50%;background:var(--s1)}
.foil-top::before{left:-9px}.foil-top::after{right:-9px}
.foil-top .chip-stock{width:50px;height:50px;font-size:17px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4),0 8px 16px -8px rgba(3,20,10,.6)}
.foil-top .chip-stock.m3{font-size:14px}
.foil-top small{display:block;font-size:12px;opacity:.7;font-weight:500}
.foil-top strong{display:block;font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.03em;line-height:1}
.foil-top .cd{text-align:right}
.foil-top .cd b{display:block;font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.02em;line-height:1}
.foil-body{padding:18px 20px 20px;border-top:2px dotted rgba(134,239,172,.3)}
.paid-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.paid-row b{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:-.035em;line-height:1}
.calc{background:rgba(0,0,0,.22);border:1px solid var(--hair);border-radius:14px;padding:14px 16px;margin-top:16px}
.calc label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.calc label b{color:var(--text)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:99px;background:linear-gradient(90deg,var(--g) var(--p,20%),rgba(255,255,255,.08) var(--p,20%));margin:14px 0 12px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(74,222,128,.3);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(74,222,128,.3);cursor:pointer}
.calc .out{font-size:14px;color:var(--muted)}
.calc .out b{color:var(--g);font-weight:700}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:2px 0 14px;gap:3px}
.split i{display:block;height:100%;border-radius:3px}
.split-legend{display:grid;gap:9px;font-size:13.5px;color:var(--muted)}
.split-legend span{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center}
.split-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.split-legend b{color:var(--text);font-weight:700}
.meter-bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06);gap:3px;margin:4px 0 12px}
.meter-bar i{display:block;height:100%;border-radius:3px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px}
.status.ok{background:var(--g-soft);color:var(--g)}
.status i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(74,222,128,.2);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(74,222,128,0)}}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.panel-h h3{margin:0}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:10px 0;font-size:14px;border-top:1px solid var(--hair)}
.checks li:first-child{border-top:0;padding-top:2px}
.checks li small{display:block;color:var(--faint);font-size:12.5px;margin-top:1px}
.ck{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--faint);transition:background .2s,color .2s}
.ck.ok{background:var(--g-soft);color:var(--g)}
.ck.fail{background:var(--red-soft);color:var(--red)}

/* create */
.create-head{margin:4px 0 26px}
.create-head h1{font-family:var(--display);font-weight:600;font-size:56px;letter-spacing:-.045em;line-height:1;margin:0 0 12px}
.create-head p{color:var(--muted);margin:0;max-width:58ch;font-size:16px}
.create-grid{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:24px;margin-bottom:80px;align-items:start}
.fsec{background:var(--s1);border:1px solid var(--hair);border-radius:var(--r-xl);padding:22px;box-shadow:var(--lift);margin-bottom:16px}
.fsec-h{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.fsec-h .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:16px;background:var(--foil);color:var(--g-ink);flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
.fsec-h h2{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.03em;margin:0;line-height:1.1}
.fsec-h p{margin:3px 0 0;color:var(--faint);font-size:13px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{margin-bottom:14px}
.fld:last-child{margin-bottom:0}
.lbl{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-bottom:7px;font-weight:500}
.lbl em{font-style:normal;color:var(--faint);font-weight:400}
.tinput{width:100%;height:48px;border-radius:12px;border:1px solid var(--hair2);background:rgba(0,0,0,.22);padding:0 14px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.tinput{height:88px;padding:12px 14px;resize:vertical}
.tinput::placeholder{color:var(--faint)}
.tinput:focus{border-color:var(--g);box-shadow:0 0 0 4px rgba(74,222,128,.12)}
.tinput.bad{border-color:rgba(255,107,129,.65);box-shadow:none}
.drop{border:1.5px dashed var(--hair3);border-radius:14px;padding:16px;display:flex;gap:16px;align-items:center;cursor:pointer;background:rgba(0,0,0,.18);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--g);background:var(--g-soft)}
.drop img,.drop .ph{width:72px;height:72px;border-radius:16px;object-fit:cover;background:rgba(255,255,255,.04);flex:none;display:grid;place-items:center;color:var(--g)}
.drop p{margin:0;font-size:14px;font-weight:500}
.drop p small{display:block;color:var(--faint);margin-top:2px;font-weight:400}
.stocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.stock-opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:11px;align-items:center;text-align:left;padding:11px;border-radius:13px;border:1px solid var(--hair);background:rgba(0,0,0,.18);transition:border-color .15s,background .15s,transform .15s}
.stock-opt:hover{border-color:var(--hair2);transform:translateY(-1px)}
.stock-opt .chip-stock{width:36px;height:36px;font-size:13px}
.stock-opt .chip-stock.m3{font-size:11px}
.stock-opt b{display:block;font-size:14px;font-weight:700;line-height:1.25}
.stock-opt span{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--faint);white-space:nowrap}
.stock-opt[aria-checked="true"]{border-color:transparent;background:var(--g-soft);box-shadow:inset 0 0 0 1.5px var(--g)}
.sticky{position:sticky;top:96px}
.sumline{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-top:1px solid var(--hair);color:var(--muted)}
.sumline:first-of-type{border-top:0}
.sumline b{color:var(--text);font-weight:700}

/* pages */
.page-h{font-family:var(--display);font-weight:600;font-size:56px;letter-spacing:-.045em;line-height:1;margin:40px 0 12px}
.page-lede{color:var(--muted);margin:0 0 30px;max-width:60ch;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--hair);border-radius:var(--r-lg);background:rgba(255,255,255,.015);margin-bottom:18px}
.tiles > div{padding:18px 22px;border-left:1px solid var(--hair)}
.tiles > div:first-child{border-left:0}
.tiles b{display:block;font-family:var(--display);font-weight:600;font-size:32px;letter-spacing:-.035em;line-height:1.1}
.tiles span{font-size:13px;color:var(--faint)}
.steps{list-style:none;margin:0 0 36px;padding:0;display:grid;gap:14px}
.steps li{display:grid;grid-template-columns:56px 1fr;gap:20px;background:var(--s1);border:1px solid var(--hair);border-radius:var(--r-xl);padding:24px;box-shadow:var(--lift)}
.steps .n{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:24px;background:var(--foil);color:var(--g-ink);box-shadow:inset 0 0 0 3px rgba(255,255,255,.45),0 12px 24px -12px rgba(74,222,128,.7)}
.steps h3{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.03em;margin:4px 0 8px;line-height:1.1}
.steps p{margin:0;color:var(--muted);max-width:66ch}
.fine{color:var(--faint);font-size:13.5px;max-width:74ch;margin-bottom:28px}
.fine p{margin:0 0 8px}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(3,8,6,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal-bg.on{display:flex}
.modal{background:var(--s1);border:1px solid var(--hair2);border-radius:26px;width:min(460px,100%);overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.9),0 0 0 1px rgba(74,222,128,.05);animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.modal .mcoin{height:170px;position:relative;background:radial-gradient(circle at 50% 60%,rgba(74,222,128,.22),rgba(74,222,128,0) 62%)}
.modal .mcoin canvas{width:100%!important;height:100%!important}
.modal .in{padding:6px 26px 26px}
.modal h2{font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:-.035em;margin:0 0 6px;line-height:1.1}
.modal p{color:var(--muted);margin:0 0 16px}
.prog{list-style:none;margin:0;padding:0}
.prog li{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:center;padding:8px 0;color:var(--faint);transition:color .2s}
.prog li.done,.prog li.now{color:var(--text)}
.prog .ck{width:26px;height:26px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--g);border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:rgba(25,38,32,.97);border:1px solid var(--hair3);border-radius:14px;padding:11px 16px;font-size:14px;font-weight:500;box-shadow:0 16px 40px -16px rgba(0,0,0,.8);animation:pop .2s ease-out}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--g)}

footer.foot{border-top:1px solid var(--hair);padding:26px 0 44px;color:var(--faint);font-size:13px}
footer.foot .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.tabbar{display:none}

@media (max-width:1080px){
  .hero{grid-template-columns:1fr;gap:10px;padding-top:36px}
  .stage{height:460px}
  .coin-grid,.create-grid{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static}
  .leaders{grid-template-columns:1fr 1fr}
  .leaders .leader:nth-child(3){display:none}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpis > div:nth-child(4){border-left:0}
  .kpis > div:nth-child(n+4){border-top:1px solid var(--hair)}
}
@media (max-width:760px){
  .wrap{padding:0 16px}
  .top .wrap{height:60px;gap:12px}
  .logo{font-size:22px}
  .logo-mark{width:28px;height:28px}
  nav.links,.search kbd,#createTop{display:none}
  .search{max-width:none}
  .search input{height:38px}
  #connectBtn .lbl-long{display:none}
  #connectBtn .lbl-short{display:inline}
  .top .btn{height:38px;padding:0 13px;font-size:14px}
  .hero{padding-top:28px}
  .hero h1{font-size:44px}
  .stage{order:-1;height:330px;margin:-12px -16px 8px}
  .round-card{display:none}
  .next-card{right:16px;top:auto;bottom:6px}
  .stats-band,.tiles{grid-template-columns:1fr 1fr}
  .stats-band > div:nth-child(3),.tiles > div:nth-child(3){border-left:0}
  .stats-band > div:nth-child(n+3),.tiles > div:nth-child(n+3){border-top:1px solid var(--hair)}
  .stats-band b,.tiles b{font-size:24px}
  .leaders{grid-template-columns:1fr}
  .leaders .leader:nth-child(3){display:flex}
  .sec-h h2{font-size:28px}
  .form-row{grid-template-columns:1fr}
  .coin-head{align-items:flex-start;gap:12px}
  .coin3d{width:92px;height:92px}
  .coin3d img{width:70px;height:70px;margin:11px}
  .coin-head h1{font-size:32px}
  .coin-head h1 .t{display:block;margin:6px 0 0;font-size:15px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpis > div:nth-child(odd){border-left:0}
  .kpis > div:nth-child(4){border-left:1px solid var(--hair)}
  .kpis > div:nth-child(n+3){border-top:1px solid var(--hair)}
  .kpis > div:last-child{grid-column:1/-1}
  .kpis b{font-size:22px}
  .chart-box{height:240px}
  .page-h,.create-head h1{font-size:40px}
  .steps li{grid-template-columns:1fr;gap:12px}
  .fsec{padding:18px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(10,15,13,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--hair);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--faint);padding:6px 0;border-radius:12px;font-weight:500}
  .tabbar a[aria-current="page"]{color:var(--g)}
  .tabbar a.mk span.plus{width:42px;height:30px;border-radius:10px;background:var(--g);color:var(--g-ink);display:grid;place-items:center;margin-top:-2px;box-shadow:0 8px 18px -8px rgba(74,222,128,.8)}
  body{padding-bottom:76px}
  .toasts{bottom:92px}
}


/* ---------- zh layer: everything below is new for the Chinese skin ---------- */
/* Layout: the prototype's own grid and components; only type, copy, the hero coin, the seal and the up/down colour change. */
:root{
  --display:"Plus Jakarta Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --ui:"Plus Jakarta Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --serif-zh:"Noto Serif SC","Songti SC","SimSun",serif;
  --seal:#D7263D; --seal-ink:#FFF4E8;
  --up:var(--g); --down:var(--red); --up-soft:var(--g-soft); --down-soft:var(--red-soft);
}
:root[data-updown="cn"]{--up:var(--red); --down:var(--g); --up-soft:var(--red-soft); --down-soft:var(--g-soft)}
.up{color:var(--up)} .down{color:var(--down)}
.chg.up{background:var(--up-soft)} .chg.down{background:var(--down-soft)}

header.top{top:env(safe-area-inset-top,0px)}
body::after{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bg)}

/* Han characters don't take the negative tracking Latin display type uses. */
:root[lang="zh"] .hero h1{font-weight:900;letter-spacing:.01em;line-height:1.12;font-size:clamp(46px,5.6vw,84px)}
:root[lang="zh"] .sec-h h2,:root[lang="zh"] .leader-name,:root[lang="zh"] .card-name{letter-spacing:.01em;font-weight:700}
:root[lang="zh"] .hero p.lede{max-width:30em;line-height:1.75}
:root[lang="zh"] nav.links a,:root[lang="zh"] .seg button{letter-spacing:.04em}

/* mockup controls, outside the design */
.mock{border-bottom:1px solid var(--hair);background:var(--s1);font-size:12.5px;color:var(--faint)}
.mock .wrap{display:flex;align-items:center;gap:10px;min-height:38px;flex-wrap:wrap;padding-block:4px}
.mock .seg{padding:2px}
.mock .seg button{height:26px;padding:0 10px;font-size:12.5px}
.mock .note{margin-left:auto}

.lang{display:inline-flex;align-items:center;height:42px;border-radius:12px;border:1px solid var(--hair2);background:rgba(255,255,255,.03);padding:3px;gap:2px;flex:none}
.lang button{border:0;background:transparent;color:var(--faint);height:34px;min-width:34px;padding:0 9px;border-radius:9px;font-weight:700;font-size:13.5px}
.lang button[aria-pressed="true"]{background:var(--g-soft);color:var(--g-hi)}

/* hero coin: the Koin belah mark as a square-holed cash coin */

function usd(v){

</svg>`;
}

/* ---------- page ---------- */
function hourFrac(){const d=new Date();return(d.getMinutes()*60+d.getSeconds())/3600}
function nextPayout(){const d=new Date();const s=3600-(d.getMinutes()*60+d.getSeconds());return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function ring(size=30,stroke=3.5){const r=(size-stroke)/2,c=2*Math.PI*r;return`<span class="ring"><svg width="${size}" height="${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(255,255,255,.1)" stroke-width="${stroke}" fill="none"/><circle data-ring="${c}" cx="${size/2}" cy="${size/2}" r="${r}" stroke="#4ADE80" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-hourFrac())}"/></svg></span>`}

const ROUND=[["JIUCAI",.0213],["DAGONG",.0391],["TANG",.0127]].map(([tk,amt])=>({coin:COINS.find(c=>c.tk===tk),amt}));
const roundUsd=ROUND.reduce((a,p)=>a+p.amt*STOCK[p.coin.pays].px,0)*41.3;
const holdersPaid=COINS.reduce((a,c)=>a+c.holders,0);

function sorted(){
  let l=COINS.filter(c=>state.pays==="all"||c.pays===state.pays);
  const q=($("#search").value||"").trim().toLowerCase();
  if(q)l=l.filter(c=>c.name.includes(q)||c.tk.toLowerCase().includes(q.replace(/^\$/,""))||c.pays.toLowerCase().includes(q));
  const by={trending:(a,b)=>b.vol-a.vol,new:(a,b)=>a.min-b.min,payers:(a,b)=>b.paid-a.paid,graduate:(a,b)=>(b.grad?-1:b.progress)-(a.grad?-1:a.progress)}[state.sort];
  return l.slice().sort(by);
}
function renderGrid(){const g=$("#grid");if(!g)return;const l=sorted();g.innerHTML=l.length?l.map(card).join(""):`<div class="empty">${t("empty")}</div>`}

function renderStrip(){
  const ev=[];
  COINS.slice(0,7).forEach((c,i)=>ev.push(`<span class="ev"><img src="${c.img}" alt="">${t("evPaid")(esc(c.tk),num(c.paid/STOCK[c.pays].px/(30+i*7)),esc(c.pays))}</span>`));
  COINS.filter(c=>c.min<60).forEach((c,i)=>ev.splice(2+i*3,0,`<span class="ev"><img src="${c.img}" alt="">${t("evLaunch")(esc(c.tk),c.min)}</span>`));
  COINS.filter(c=>c.grad).forEach((c,i)=>ev.splice(4+i*3,0,`<span class="ev"><img src="${c.img}" alt="">${t("evGrad")(esc(c.tk))}</span>`));
  const html=ev.join("");$("#strip").innerHTML=html+html.replace(/<span class="ev/g,'<span aria-hidden="true" class="ev');
}

function render(){
  const root=document.documentElement;
  root.lang=state.lang;root.dataset.updown=state.ud;
  document.title=state.lang==="zh"?"hwai 中文版":"hwai Chinese skin";
  $$("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  $("#search").placeholder=t("searchPh");
  $("#mockLabel").textContent=t("mockLabel");$("#mockNote").textContent=t("mockNote");
  $$("[data-ud]").forEach(b=>{b.textContent=t(b.dataset.ud==="cn"?"udCn":"udIntl");b.setAttribute("aria-pressed",b.dataset.ud===state.ud)});
  $$("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===state.lang));

  const totalPaid=COINS.reduce((a,c)=>a+c.paid,0),vol=COINS.reduce((a,c)=>a+c.vol,0);
  const leaders=COINS.slice().sort((a,b)=>b.vol-a.vol).slice(0,3);
  const paysUsed=[...new Set(COINS.map(c=>c.pays))];
  $("#app").innerHTML=`
  <section class="hero">
    <div>
      <span class="eyecatch"><span class="dot">${icon("bolt",12)}</span>${t("eyecatch")(usd(roundUsd))}</span>
      <h1>${t("h1")}</h1>
      <p class="lede">${t("lede")}</p>
      <div class="ctas"><a class="btn btn-g btn-lg" href="#">${t("ctaCreate")}</a><a class="btn btn-ghost btn-lg" href="#">${t("ctaHow")}</a></div>
      <div class="promises">
        <a class="tag" href="#">${icon("gift")}${t("p1")}</a>
        <a class="tag" href="#">${icon("lock")}${t("p2")}</a>
        <a class="tag" href="#">${icon("shield")}${t("p3")}</a>
        <a class="tag" href="#">${icon("receipt")}${t("p4")}</a>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="pattern"></div><div class="halo"></div><div class="floor"></div>
      <div class="qian" id="qian">${qian()}</div>
      <div class="seal" aria-hidden="true"><span>美</span><span>股</span><span>分</span><span>红</span></div>
      <div class="glass next-card">${ring()}<div><div class="k">${t("next")}</div><b data-countdown>${nextPayout()}</b></div></div>
      <div class="glass round-card">
        <div class="k">${t("lastRound")}</div>
        <div class="v">${usdFull(roundUsd)}</div>
        <div class="k">${t("paidTo")(holdersPaid.toLocaleString("en-US"))}</div>
        <div class="rows">${ROUND.map(p=>`<div class="row"><img src="${p.coin.img}" alt=""><span>$${esc(p.coin.tk)}</span><b>${num(p.amt)} ${esc(p.coin.pays)}</b></div>`).join("")}</div>
      </div>
    </div>
  </section>

  <div class="stats-band">
    <div><b>${usdFull(totalPaid)}</b><span>${t("sPaid")}</span></div>
    <div><b>${usdFull(vol)}</b><span>${t("sVol")}</span></div>
    <div><b>${COINS.length}</b><span>${t("sLive")}</span></div>
    <div><b>${Object.keys(STOCK).length}</b><span>${t("sStocks")}</span></div>
  </div>

  <section aria-labelledby="leadH">
    <div class="sec-h"><div><h2 id="leadH">${t("leadH")}</h2><p>${t("leadP")}</p></div></div>
    <div class="leaders">${leaders.map((c,i)=>`<a class="leader tilt" href="#"><span class="rank">${i+1}</span>
      <div class="leader-top"><img src="${c.img}" alt="" width="64" height="64"><div><div class="leader-name">${esc(c.name)}</div><div class="leader-tick">${esc(t("leadTick")(c.tk,usd(c.mcap)))}</div></div></div>
      <div class="leader-paid"><b>${usd(c.vol*.005)}</b><span>${t("paidToday")}<br>${num(c.vol*.005/STOCK[c.pays].px)} ${esc(c.pays)}</span></div>
      ${coupon(c)}</a>`).join("")}</div>
  </section>

  <section aria-labelledby="allH">
    <div class="sec-h"><div><h2 id="allH">${t("allH")}</h2></div></div>
    <div class="toolbar">
      <div class="seg" role="group">${Object.entries(t("sorts")).map(([k,l])=>`<button type="button" data-sort="${k}" aria-pressed="${state.sort===k}">${l}</button>`).join("")}</div>
      <div class="pays-filter" role="group"><span>${t("paysIn")}</span><button type="button" class="fchip all" data-pays="all" aria-pressed="${state.pays==="all"}">${t("all")}</button>${paysUsed.map(s=>`<button type="button" class="fchip" data-pays="${s}" aria-pressed="${state.pays===s}">${chip(s)}${s}</button>`).join("")}</div>
    </div>
    <div class="grid" id="grid"></div>
  </section>`;
  renderGrid();renderStrip();
  $$("[data-sort]").forEach(b=>b.onclick=()=>{state.sort=b.dataset.sort;$$("[data-sort]").forEach(x=>x.setAttribute("aria-pressed",x===b));renderGrid()});
  $$("[data-pays]").forEach(b=>b.onclick=()=>{state.pays=b.dataset.pays;$$("[data-pays]").forEach(x=>x.setAttribute("aria-pressed",x===b));renderGrid()});
}

$$("[data-lang]").forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;store.set("hwai-zh-lang",state.lang);render()});
$$("[data-ud]").forEach(b=>b.onclick=()=>{state.ud=b.dataset.ud;store.set("hwai-zh-ud",state.ud);render()});
$("#search").addEventListener("input",renderGrid);
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==$("#search")){e.preventDefault();$("#search").focus()}});
setInterval(()=>{const el=$("[data-countdown]");if(el)el.textContent=nextPayout();const r=$("[data-ring]");if(r)r.setAttribute("stroke-dashoffset",r.dataset.ring*(1-hourFrac()))},1000);

/* tilt: cards (prototype behaviour) and the hero coin */
let tiltEl=null;
document.addEventListener("pointermove",e=>{
  if(reduced||e.pointerType==="touch")return;
  const st=$("#stage"),q=$("#qian svg");
  if(st&&q){const r=st.getBoundingClientRect();if(e.clientY>r.top&&e.clientY<r.bottom&&e.clientX>r.left&&e.clientX<r.right){const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;q.style.transform=`rotateX(${(.5-y)*24}deg) rotateY(${(x-.5)*30}deg)`}else q.style.transform=""}
  const el=e.target.closest?.(".tilt");
  if(tiltEl&&tiltEl!==el){tiltEl.classList.remove("on");tiltEl.style.transform="";tiltEl=null}
  if(!el)return;tiltEl=el;
  const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  el.classList.add("on");el.style.setProperty("--mx",x*100+"%");el.style.setProperty("--my",y*100+"%");
  el.style.transform=`perspective(1000px) rotateX(${(.5-y)*9}deg) rotateY(${(x-.5)*11}deg) translateY(-4px)`;
});

render();
</script>
